  <text x="208" y="128" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="600" fill="#e8ecf1" letter-spacing="2">Tony Zhao</text>
  <text x="208" y="160" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#5c6672" letter-spacing="4">PORTFOLIO</text>

