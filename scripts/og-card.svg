  <text x="88" y="398" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="68" font-weight="600" fill="#e8ecf1">变成真正落地的<span fill="#3b82f6">数字产品</span>。</text>

  <!-- 副标题 -->
